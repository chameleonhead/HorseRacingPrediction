name: app-deploy

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .config/**
      - Dockerfile
      - Dockerfile.collector-lambda
      - .dockerignore
      - deploy/**
      - infra/collector-lambda/**
      - .github/workflows/app-deploy.yml
  workflow_dispatch:
    inputs:
      horse_id_migration_operation_id:
        description: Existing staged horse-identity migration GUID; leave empty for a normal deploy
        required: false
        type: string
      api_startup_recovery:
        description: Restore the API only from the expected blocked deployment; leaves collection paused
        required: false
        default: false
        type: boolean
      expected_deployed_sha:
        description: Exact currently deployed API commit SHA required for API startup recovery
        required: false
        type: string
      operator_ui_recovery_operation_id:
        description: Existing bound horse-identity operation GUID for protected operator UI bootstrap
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: horse-racing-prediction-production-deploy
  cancel-in-progress: false

env:
  APP_DIRECTORY: /opt/horse-racing-prediction/app

jobs:
  diagnose-api-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.api_startup_recovery == true
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Validate read-only API diagnosis inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_STARTUP_RECOVERY: ${{ inputs.api_startup_recovery || false }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha || '' }}
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
          OPERATOR_UI_RECOVERY_OPERATION_ID: ${{ inputs.operator_ui_recovery_operation_id || '' }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$API_STARTUP_RECOVERY" != "true" ] || \
             [[ ! "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ] || [ -n "$OPERATOR_UI_RECOVERY_OPERATION_ID" ]; then
            echo "Read-only API diagnosis requires manual recovery mode, one exact SHA, and no migration request." >&2
            exit 2
          fi

      - name: Classify the expected API container without inspecting its data
        id: classify
        uses: appleboy/ssh-action@v1.2.5
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/horse-racing-prediction-api
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          capture_stdout: true
          envs: EXPECTED_DEPLOYED_SHA,IMAGE_NAME,APP_DIRECTORY
          script: |
            set -eu
            [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "DIAGNOSTIC code=INPUT_INVALID"; exit 2; }
            [[ "$IMAGE_NAME" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/horse-racing-prediction-api$ ]] || { echo "DIAGNOSTIC code=IMAGE_NAME_INVALID"; exit 2; }
            cd "$APP_DIRECTORY"
            test -f .env && test ! -L .env || { echo "DIAGNOSTIC code=CONFIG_UNAVAILABLE"; exit 1; }
            expected_image="${IMAGE_NAME,,}:sha-$EXPECTED_DEPLOYED_SHA"
            api_ids="$(docker compose --env-file .env ps --all -q api)" || { echo "DIAGNOSTIC code=CONTAINER_LOOKUP_FAILED"; exit 1; }
            mapfile -t api_containers <<< "$api_ids"
            if [ "${#api_containers[@]}" -ne 1 ] || [ -z "${api_containers[0]}" ]; then
              echo "DIAGNOSTIC code=CONTAINER_COUNT_INVALID"; exit 1
            fi
            read -r image state < <(docker inspect --format '{{.Config.Image}} {{.State.Status}}' "${api_containers[0]}") || {
              echo "DIAGNOSTIC code=CONTAINER_INSPECT_FAILED"; exit 1;
            }
            [ "$image" = "$expected_image" ] || { echo "DIAGNOSTIC code=IMAGE_MISMATCH"; exit 1; }
            case "$state" in
              running) echo "DIAGNOSTIC code=NOT_APPLICABLE state=running image_sha=$EXPECTED_DEPLOYED_SHA" ;;
              exited) echo "DIAGNOSTIC code=STOPPED image_sha=$EXPECTED_DEPLOYED_SHA" ;;
              *) echo "DIAGNOSTIC code=CONTAINER_STATE_UNSUPPORTED"; exit 1 ;;
            esac

      - name: Stage bounded diagnostic helper outside the application directory
        if: contains(steps.classify.outputs.stdout, 'DIAGNOSTIC code=STOPPED')
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: deploy/horse-id-migration-deploy.sh
          target: /tmp/hrp-api-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1

      - name: Diagnose the exact stopped API without changing production state
        if: contains(steps.classify.outputs.stdout, 'DIAGNOSTIC code=STOPPED')
        uses: appleboy/ssh-action@v1.2.5
        timeout-minutes: 5
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/horse-racing-prediction-api
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          DIAGNOSTIC_HELPER: /tmp/hrp-api-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/horse-id-migration-deploy.sh
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 4m
          envs: EXPECTED_DEPLOYED_SHA,IMAGE_NAME,APP_DIRECTORY,DIAGNOSTIC_HELPER
          script: |
            set -euo pipefail
            diagnostic_directory="${DIAGNOSTIC_HELPER%/*}"
            cleanup_diagnostic_helper() { rm -f -- "$DIAGNOSTIC_HELPER"; rmdir -- "$diagnostic_directory" 2>/dev/null || true; }
            trap cleanup_diagnostic_helper EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "DIAGNOSTIC code=INPUT_INVALID"; exit 2; }
            [[ "$IMAGE_NAME" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/horse-racing-prediction-api$ ]] || { echo "DIAGNOSTIC code=IMAGE_NAME_INVALID"; exit 2; }
            cd "$APP_DIRECTORY"
            test -f .env && test ! -L .env || { echo "DIAGNOSTIC code=CONFIG_UNAVAILABLE"; exit 1; }
            expected_image="${IMAGE_NAME,,}:sha-$EXPECTED_DEPLOYED_SHA"
            api_ids="$(docker compose --env-file .env ps --all -q api)" || { echo "DIAGNOSTIC code=CONTAINER_LOOKUP_FAILED"; exit 1; }
            mapfile -t api_containers <<< "$api_ids"
            if [ "${#api_containers[@]}" -ne 1 ] || [ -z "${api_containers[0]}" ]; then
              echo "DIAGNOSTIC code=CONTAINER_COUNT_INVALID"; exit 1
            fi
            container="${api_containers[0]}"
            read -r image state exit_code oom_killed restart_count < <(docker inspect --format '{{.Config.Image}} {{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}} {{.RestartCount}}' "$container") || {
              echo "DIAGNOSTIC code=CONTAINER_INSPECT_FAILED"; exit 1;
            }
            [ "$image" = "$expected_image" ] || { echo "DIAGNOSTIC code=IMAGE_MISMATCH"; exit 1; }
            if [ "$state" = "running" ]; then
              echo "DIAGNOSTIC code=NOT_APPLICABLE state=running image_sha=$EXPECTED_DEPLOYED_SHA"
              exit 0
            fi
            [ "$state" = "exited" ] || { echo "DIAGNOSTIC code=CONTAINER_STATE_UNSUPPORTED"; exit 1; }
            [[ "$exit_code" =~ ^[0-9]{1,3}$ && "$restart_count" =~ ^[0-9]{1,6}$ && ( "$oom_killed" = "true" || "$oom_killed" = "false" ) ]] || {
              echo "DIAGNOSTIC code=CONTAINER_METADATA_INVALID"; exit 1;
            }
            . "$DIAGNOSTIC_HELPER"
            printf 'CONTAINER state=exited exit_code=%s oom=%s restarts=%s image_sha=%s\n' "$exit_code" "$oom_killed" "$restart_count" "$EXPECTED_DEPLOYED_SHA"
            logs_status=0
            if timeout --signal=TERM --kill-after=2s 15s docker logs --tail 200 "$container" 2>&1 | head -c 262145 | horse_id_migration_sanitize_startup_logs; then
              :
            else
              logs_status=$?
              echo "STARTUP_LOGS code=UNAVAILABLE"
            fi
            journal_status=0
            horse_id_migration_diagnose_startup_journal "$APP_DIRECTORY/data" || journal_status=$?
            configured_store_paths="$(horse_id_migration_configured_store_paths "$APP_DIRECTORY/data")" || { echo "BACKUP code=CONFIGURED_STORES_UNAVAILABLE"; exit 1; }
            mapfile -t configured_stores <<< "$configured_store_paths"
            for index in "${!configured_stores[@]}"; do configured_stores[$index]=${configured_stores[$index]%$'\r'}; done
            backup_members=("${configured_stores[@]}" "horse-identity-migration-initialized.marker")
            backup_status=0
            horse_id_migration_verify_recovery_backup "$APP_DIRECTORY/data" "$EXPECTED_DEPLOYED_SHA" "${backup_members[@]}" || backup_status=$?
            [ "$logs_status" -eq 0 ] && [ "$journal_status" -eq 0 ] && [ "$backup_status" -eq 0 ] || exit 1

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate optional migration request before publishing or deployment
        shell: bash
        env:
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
          API_STARTUP_RECOVERY: ${{ inputs.api_startup_recovery || false }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha || '' }}
          OPERATOR_UI_RECOVERY_OPERATION_ID: ${{ inputs.operator_ui_recovery_operation_id || '' }}
        run: |
          if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ] && \
             { [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || \
               [[ ! "$HORSE_ID_MIGRATION_OPERATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || \
               [ "$HORSE_ID_MIGRATION_OPERATION_ID" = "00000000-0000-0000-0000-000000000000" ]; }; then
            echo "Migration mode requires a manual dispatch with exactly one operation GUID." >&2
            exit 2
          fi
          if [ "$API_STARTUP_RECOVERY" = "true" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || \
               [[ ! "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
              echo "API startup recovery requires a manual dispatch, one exact lowercase deployed SHA, and no migration operation input." >&2
              exit 2
            fi
          elif [ -n "$EXPECTED_DEPLOYED_SHA" ] && [ -z "$OPERATOR_UI_RECOVERY_OPERATION_ID" ]; then
            echo "Expected deployed SHA is accepted only with explicit API startup recovery." >&2
            exit 2
          fi
          if [ -n "$OPERATOR_UI_RECOVERY_OPERATION_ID" ] && \
             { [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || \
               [[ ! "$OPERATOR_UI_RECOVERY_OPERATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || \
               [ "$OPERATOR_UI_RECOVERY_OPERATION_ID" = "00000000-0000-0000-0000-000000000000" ] || \
               [ "$API_STARTUP_RECOVERY" = "true" ] || [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ] || \
               [[ ! "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; }; then
            echo "Operator UI recovery requires one manual canonical operation GUID, one lowercase deployed SHA, and no other recovery mode." >&2
            exit 2
          fi
          if [ -n "$EXPECTED_DEPLOYED_SHA" ] && [ "$API_STARTUP_RECOVERY" != "true" ] && [ -z "$OPERATOR_UI_RECOVERY_OPERATION_ID" ]; then
            echo "Expected deployed SHA is accepted only with explicit API startup or operator UI recovery." >&2
            exit 2
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore production assemblies for gate interoperability
        run: dotnet restore HorseRacingPrediction.sln

      - name: Build the production API test fixture
        run: dotnet build tests/HorseRacingPrediction.Api.Tests/HorseRacingPrediction.Api.Tests.csproj --no-restore --configuration Debug

      - name: Verify deployment pause and failure guards
        shell: pwsh
        timeout-minutes: 3
        run: ./tests/scripts/test-deploy-pipeline-state.ps1 -Bash /bin/bash

      - name: Verify horse identity migration deploy guard
        shell: pwsh
        timeout-minutes: 3
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP ("hrp-horse-identity-deploy-interop-" + [guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $fixtureDirectory)
          $env:HRP_HORSE_IDENTITY_DEPLOY_INTEROP_FIXTURE_DIR = $fixtureDirectory
          try {
            dotnet test tests/HorseRacingPrediction.Api.Tests/HorseRacingPrediction.Api.Tests.csproj --no-restore --no-build --configuration Debug --filter 'FullyQualifiedName~HorseIdentityMigrationDeployInteropTests'
            if ($LASTEXITCODE -ne 0) { throw 'Typed deployment fixture producer failed.' }
            ./tests/scripts/test-deploy-migration-guard.ps1 -Bash /bin/bash -OperatorFixtureDirectory $fixtureDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Horse identity migration deploy guard failed.' }
          }
          finally {
            if (Test-Path -LiteralPath $fixtureDirectory) { Remove-Item -LiteralPath $fixtureDirectory -Recurse -Force }
          }

      - name: Verify collector temporary storage lifecycle
        shell: pwsh
        run: ./tests/scripts/test-collector-temp-lifecycle.ps1 -Bash /bin/bash

      - name: Verify Playwright container version
        shell: pwsh
        run: ./tests/scripts/test-playwright-container-version.ps1

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build HorseRacingPrediction.sln --no-restore --configuration Release

      - name: Install Playwright Chromium
        shell: bash
        run: |
          # ubuntu-latest includes an unrelated Google Chrome APT source. A mirror
          # publication race there must not prevent Playwright Chromium setup.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pwsh tests/HorseRacingPrediction.Scraping.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Verify database migration model
        run: dotnet ef migrations has-pending-model-changes --project src/HorseRacingPrediction.Infrastructure/HorseRacingPrediction.Infrastructure.csproj --no-build --configuration Release

      - name: Apply migrations to an empty SQLite database
        run: dotnet ef database update --project src/HorseRacingPrediction.Infrastructure/HorseRacingPrediction.Infrastructure.csproj --no-build --configuration Release --connection "Data Source=${{ runner.temp }}/eventstore-ci.db"

      - name: Test
        run: dotnet test HorseRacingPrediction.sln --no-build --configuration Release --filter "TestCategory!=External"

      - name: Check vulnerable dependencies
        run: dotnet list HorseRacingPrediction.sln package --vulnerable --include-transitive

      - name: Verify isolated API repair and cross-process locks
        shell: pwsh
        run: ./tests/scripts/test-entry-repair-local-host.ps1 -Configuration Release

      - uses: hashicorp/setup-terraform@v4

      - name: Validate collector Lambda Terraform
        timeout-minutes: 10
        run: |
          terraform fmt -check -recursive
          terraform -chdir=infra/collector-lambda init -backend=false -input=false
          pwsh ./tests/scripts/test-collection-dispatch-dashboard-shape.ps1
          terraform -chdir=infra/collector-lambda validate

      - name: Build collector Lambda container
        run: |
          docker build -f Dockerfile.collector-lambda -t collector-lambda-ci .
          docker run --rm --entrypoint /var/task/.playwright/node/linux-x64/node \
            collector-lambda-ci -e \
            "const { chromium } = require('/var/task/.playwright/package'); (async () => { const browser = await chromium.launch({ headless: true }); const page = await browser.newPage(); await page.setContent('<main>ready</main>'); if (await page.textContent('main') !== 'ready') throw new Error('Unexpected page content'); await browser.close(); console.log('PASS Playwright Chromium launched in collector image'); })().catch(error => { console.error(error); process.exit(1); });"
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/tests/scripts/test-collector-core-suppression.sh:/tmp/test-collector-core-suppression.sh:ro" \
            collector-lambda-ci /tmp/test-collector-core-suppression.sh \
            /var/runtime/bootstrap /var/runtime/collector-temp-lifecycle.sh

  build-and-push:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve image name
        id: image
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/horse-racing-prediction-api" >> "$GITHUB_OUTPUT"

      - name: Publish API
        run: dotnet publish src/HorseRacingPrediction.Api/HorseRacingPrediction.Api.csproj -c Release -o /tmp/hrp-api-publish

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.image_name }}:latest

  recover-api-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.api_startup_recovery == true && inputs.operator_ui_recovery_operation_id == ''
    needs: [verify, build-and-push]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Wait for SSH availability
        run: |
          for attempt in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              echo "SSH port reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Upload only the verified recovery helper
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: deploy/horse-id-migration-deploy.sh
          target: ${{ env.APP_DIRECTORY }}
          strip_components: 1

      - name: Recover only the exact blocked API image
        timeout-minutes: 40
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          TARGET_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          HORSE_RACING_API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 38m
          envs: IMAGE_NAME,IMAGE_TAG,EXPECTED_DEPLOYED_SHA,TARGET_COMMIT_SHA,APP_DIRECTORY,DOMAIN_NAME,LIGHTSAIL_HOST,HORSE_RACING_API_KEY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          script: |
            bash -s <<'API_STARTUP_RECOVERY'
            set -eu
            . "$APP_DIRECTORY/horse-id-migration-deploy.sh"
            horse_id_migration_require_tools
            horse_id_migration_require_recovery_tools
            if [[ ! "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ || ! "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Recovery revisions are malformed." >&2
              exit 2
            fi
            requested_image_name="$IMAGE_NAME"
            requested_image_tag="$IMAGE_TAG"
            [ "$requested_image_tag" = "sha-$TARGET_COMMIT_SHA" ] || {
              echo "Target image tag does not match the verified source commit." >&2
              exit 2
            }
            cd "$APP_DIRECTORY"
            [ -f .env ] && [ ! -L .env ] || { echo "Existing API deployment configuration is unavailable." >&2; exit 1; }
            expected_current_image="$requested_image_name:sha-$EXPECTED_DEPLOYED_SHA"
            target_image="$requested_image_name:$requested_image_tag"
            unset IMAGE_NAME IMAGE_TAG
            compose_config="$(docker compose --env-file .env config --format json)" || { echo "Could not read the current Compose project configuration safely." >&2; exit 1; }
            expected_compose_project="$(python3 -c 'import json,sys; value=json.load(sys.stdin).get("name"); print(value if isinstance(value,str) else "")' <<< "$compose_config")" || {
              echo "Could not parse the current Compose project identity safely." >&2
              exit 1
            }
            unset compose_config
            [ -n "$expected_compose_project" ] || { echo "Could not identify the current Compose project safely." >&2; exit 1; }
            api_ids="$(docker compose --env-file .env ps --all -q api)"
            mapfile -t api_containers <<< "$api_ids"
            [ "${#api_containers[@]}" -eq 1 ] && [ -n "${api_containers[0]}" ] || {
              echo "Expected exactly one existing Compose API container before recovery." >&2
              exit 1
            }
            container_metadata="$(docker inspect --format '{{.Config.Image}} {{.State.Status}} {{index .Config.Labels "com.docker.compose.service"}} {{index .Config.Labels "com.docker.compose.project"}}' "${api_containers[0]}")" || {
              echo "Could not inspect the existing Compose API container." >&2
              exit 1
            }
            read -r current_image current_state compose_service compose_project extra_metadata <<< "$container_metadata"
            [ -n "$current_image" ] && [ -n "$current_state" ] && [ -n "$compose_service" ] && [ -n "$compose_project" ] && [ -z "${extra_metadata:-}" ] || {
              echo "Existing API container inspection returned incomplete or unexpected metadata." >&2
              exit 1
            }
            [ "$current_image" = "$expected_current_image" ] && [ "$compose_service" = "api" ] && [ "$compose_project" = "$expected_compose_project" ] || {
              echo "Existing API container is not the expected Compose-owned image." >&2
              exit 1
            }
            domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
            case "$current_state" in
              running)
                horse_id_migration_assert_api_startup_blocked "https://$domain" "$HORSE_RACING_API_KEY"
                ;;
              exited)
                echo "Verified the expected API container is stopped; blocked HTTP check is not applicable."
                ;;
              *)
                echo "Existing API container is neither running nor safely stopped." >&2
                exit 1
                ;;
            esac
            IMAGE_NAME="$requested_image_name"
            IMAGE_TAG="$requested_image_tag"
            export IMAGE_NAME IMAGE_TAG
            docker compose --env-file .env pull api
            horse_id_migration_check_image_capability "$target_image"
            recovery_started=false
            recovery_succeeded=false
            recovery_cleanup() {
              status=$?
              trap - EXIT HUP INT TERM
              if [ "$recovery_started" = true ] && [ "$recovery_succeeded" != true ]; then
                docker compose --env-file .env stop api >/dev/null 2>&1 || true
                if [ -n "$(docker compose --env-file .env ps --status running -q api 2>/dev/null)" ]; then
                  echo "API could not be held stopped after recovery failure." >&2
                  status=1
                fi
              fi
              horse_id_migration_release_source_ownership
              exit "$status"
            }
            trap recovery_cleanup EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            recovery_started=true
            docker compose --env-file .env stop api
            [ -z "$(docker compose --env-file .env ps --status running -q api)" ] || {
              echo "API did not stop before offline recovery inspection." >&2
              exit 1
            }
            data_directory="$APP_DIRECTORY/data"
            configured_store_paths="$(horse_id_migration_configured_store_paths "$data_directory")"
            mapfile -t configured_stores <<< "$configured_store_paths"
            for index in "${!configured_stores[@]}"; do configured_stores[$index]=${configured_stores[$index]%$'\r'}; done
            [ "${#configured_stores[@]}" -ge 4 ] && [ "${configured_stores[-1]}" = "horse-identity-migration-journal.db" ] || {
              echo "Configured local store set is incomplete or unknown." >&2
              exit 1
            }
            collection_database="${configured_stores[1]}"
            ownership_rows=()
            for store in "${configured_stores[@]}"; do
              [ "$store" = "horse-identity-migration-journal.db" ] && continue
              ownership_rows+=("/data/$store"$'\t'"$data_directory/$store")
            done
            mapfile -t sorted_ownership_rows < <(printf '%s\n' "${ownership_rows[@]}" | sort)
            ownership_pairs=()
            for row in "${sorted_ownership_rows[@]}"; do
              logical=${row%%$'\t'*}
              physical=${row#*$'\t'}
              ownership_pairs+=("$physical" "$logical")
            done
            horse_id_migration_acquire_source_ownership "${ownership_pairs[@]}"
            horse_id_migration_acquire_journal_operation_lock "$data_directory/horse-identity-migration-journal.db"
            horse_id_migration_assert_recovery_collection_state "$data_directory/$collection_database"
            sleep 900
            horse_id_migration_assert_recovery_collection_state "$data_directory/$collection_database"
            verified_success_guid="$(horse_id_migration_journal_preflight "$data_directory" "")"
            backup_directory="$data_directory/backups/api-startup-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            backup_paths=("${configured_stores[@]}" horse-identity-migration-initialized.marker)
            horse_id_migration_copy_store_set "$data_directory" "$backup_directory" yes "${backup_paths[@]}"
            {
              printf 'expected_deployed_sha=%s\n' "$EXPECTED_DEPLOYED_SHA"
              printf 'target_commit_sha=%s\n' "$TARGET_COMMIT_SHA"
              printf 'created_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$backup_directory/RECOVERY-METADATA"
            chmod 600 "$backup_directory/RECOVERY-METADATA"
            horse_id_migration_update_recovery_env "$APP_DIRECTORY/.env" "$requested_image_name" "$requested_image_tag"
            horse_id_migration_release_source_ownership
            if [ -n "$verified_success_guid" ]; then
              ( horse_id_migration_run_fixed_command "$verified_success_guid" "$target_image" "$APP_DIRECTORY/.env" )
            fi
            docker compose --env-file .env up -d --no-deps --force-recreate api
            container="$(docker compose --env-file .env ps --status running -q api)"
            [ -n "$container" ] || { echo "Target API container is not running." >&2; exit 1; }
            image="$(docker inspect --format '{{.Config.Image}}' "$container")"
            [ "$image" = "$target_image" ] || { echo "Running API image differs from the verified target." >&2; exit 1; }
            horse_id_migration_wait_recovery_swagger "https://$domain"
            horse_id_migration_assert_recovery_api_ready "https://$domain" "$HORSE_RACING_API_KEY"
            recovery_succeeded=true
            echo "API startup recovery completed; collection remains paused. Backup: $backup_directory"
            API_STARTUP_RECOVERY

  recover-operator-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.operator_ui_recovery_operation_id != '' && inputs.api_startup_recovery != true
    needs: [verify, build-and-push]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Wait for SSH availability
        run: |
          for attempt in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              echo "SSH port reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Upload only the verified operator bootstrap helper
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: deploy/horse-id-migration-deploy.sh
          target: ${{ env.APP_DIRECTORY }}
          strip_components: 1

      - name: Bootstrap only the protected operator UI
        timeout-minutes: 40
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          TARGET_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          OPERATOR_UI_RECOVERY_OPERATION_ID: ${{ inputs.operator_ui_recovery_operation_id }}
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          HORSE_RACING_API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 38m
          envs: IMAGE_NAME,IMAGE_TAG,TARGET_COMMIT_SHA,EXPECTED_DEPLOYED_SHA,OPERATOR_UI_RECOVERY_OPERATION_ID,APP_DIRECTORY,DOMAIN_NAME,LIGHTSAIL_HOST,HORSE_RACING_API_KEY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          script: |
            bash -s <<'OPERATOR_UI_RECOVERY'
            set -euo pipefail
            . "$APP_DIRECTORY/horse-id-migration-deploy.sh"
            horse_id_migration_require_tools
            horse_id_migration_require_recovery_tools
            horse_id_migration_validate_guid "$OPERATOR_UI_RECOVERY_OPERATION_ID" || {
              echo "Operator UI recovery requires one canonical operation GUID." >&2
              exit 2
            }
            [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Operator UI recovery requires one exact lowercase deployed SHA." >&2
              exit 2
            }
            [[ "$TARGET_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$IMAGE_TAG" = "sha-$TARGET_COMMIT_SHA" ] || {
              echo "Operator UI target image tag is not bound to the checked-out source." >&2
              exit 2
            }
            cd "$APP_DIRECTORY"
            [ -f .env ] && [ ! -L .env ] || { echo "Existing API deployment configuration is unavailable." >&2; exit 1; }
            expected_current_image="$IMAGE_NAME:sha-$EXPECTED_DEPLOYED_SHA"
            target_image="$IMAGE_NAME:$IMAGE_TAG"
            compose_config="$(docker compose --env-file .env config --format json)" || {
              echo "Could not read the current Compose project configuration safely." >&2
              exit 1
            }
            expected_compose_project="$(python3 -c 'import json,sys; value=json.load(sys.stdin).get("name"); print(value if isinstance(value,str) else "")' <<< "$compose_config")" || {
              echo "Could not parse the current Compose project identity safely." >&2
              exit 1
            }
            unset compose_config
            [ -n "$expected_compose_project" ] || { echo "Could not identify the current Compose project safely." >&2; exit 1; }
            api_ids="$(docker compose --env-file .env ps --all -q api)" || { echo "Could not enumerate the existing API container." >&2; exit 1; }
            mapfile -t api_containers <<< "$api_ids"
            [ "${#api_containers[@]}" -eq 1 ] && [ -n "${api_containers[0]}" ] || {
              echo "Expected exactly one existing Compose API container before operator bootstrap." >&2
              exit 1
            }
            container="${api_containers[0]}"
            read -r current_image current_state compose_service compose_project extra_metadata < <(
              docker inspect --format '{{.Config.Image}} {{.State.Status}} {{index .Config.Labels "com.docker.compose.service"}} {{index .Config.Labels "com.docker.compose.project"}}' "$container") || {
              echo "Could not inspect the existing Compose API container." >&2
              exit 1
            }
            [ -n "$current_image" ] && [ -n "$current_state" ] && [ -n "$compose_service" ] && [ -n "$compose_project" ] && [ -z "${extra_metadata:-}" ] || {
              echo "Existing API container inspection returned incomplete metadata." >&2
              exit 1
            }
            [ "$current_image" = "$expected_current_image" ] && [ "$compose_service" = "api" ] && [ "$compose_project" = "$expected_compose_project" ] && [ "$current_state" = "running" ] || {
              echo "Existing API container is not the exact expected running Compose-owned image." >&2
              exit 1
            }
            old_image_repository="${expected_current_image%%:*}"
            old_image_tag="${expected_current_image##*:}"
            [[ "$old_image_repository" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/horse-racing-prediction-api$ ]] && [[ "$old_image_tag" =~ ^sha-[0-9a-f]{40}$ ]] || {
              echo "Existing deployment image coordinates are not canonical." >&2
              exit 1
            }
            domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
            horse_id_migration_assert_operator_status "https://$domain" "$HORSE_RACING_API_KEY" "$OPERATOR_UI_RECOVERY_OPERATION_ID"
            configured_store_paths="$(horse_id_migration_configured_store_paths "$APP_DIRECTORY/data")" || {
              echo "Configured persistent stores could not be resolved safely." >&2
              exit 1
            }
            mapfile -t configured_stores <<< "$configured_store_paths"
            for index in "${!configured_stores[@]}"; do configured_stores[$index]=${configured_stores[$index]%$'\r'}; done
            [ "${#configured_stores[@]}" -ge 4 ] && [ "${configured_stores[-1]}" = "horse-identity-migration-journal.db" ] || {
              echo "Configured local store set is incomplete or unknown." >&2
              exit 1
            }
            data_directory="$APP_DIRECTORY/data"
            collection_database="${configured_stores[1]}"
            source_relatives=()
            source_paths=()
            for store in "${configured_stores[@]}"; do
              [ "$store" = "horse-identity-migration-journal.db" ] && continue
              source_relatives+=("$store")
              source_paths+=("$data_directory/$store")
            done
            ownership_rows=()
            for index in "${!source_relatives[@]}"; do ownership_rows+=("/data/${source_relatives[$index]}"$'\t'"${source_paths[$index]}"); done
            mapfile -t sorted_ownership_rows < <(printf '%s\n' "${ownership_rows[@]}" | sort)
            ownership_pairs=()
            for row in "${sorted_ownership_rows[@]}"; do ownership_pairs+=("${row#*$'\t'}" "${row%%$'\t'*}"); done
            horse_id_migration_validate_operator_binding "$data_directory" "$OPERATOR_UI_RECOVERY_OPERATION_ID" "${ownership_pairs[@]}"
            pause_before_stop="$(horse_id_migration_assert_recovery_collection_state "$data_directory/$collection_database" 900)"
            old_image_id="$(docker inspect --format '{{.Image}}' "$container")"
            [[ "$old_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Existing API image has no stable content identity." >&2; exit 1; }
            docker pull "$target_image"
            target_image_id="$(docker image inspect --format '{{.Id}}' "$target_image")" || {
              echo "Verified target API image could not be inspected." >&2
              exit 1
            }
            [[ "$target_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Verified target API image has no stable content identity." >&2
              exit 1
            }
            horse_id_migration_check_image_capability "$target_image"
            stage=before-stop
            target_started=false
            target_proven=false
            leases_held=false
            operator_override=
            old_restore_override=
            old_restore_local_image=
            old_restore_tag_created=false
            operator_cleanup() {
              status=$?
              trap - EXIT HUP INT TERM
              if [ "$target_started" = true ] && [ "$target_proven" != true ]; then
                docker compose --env-file .env stop api >/dev/null 2>&1 || true
                if [ -n "$(docker compose --env-file .env ps --status running -q api 2>/dev/null)" ]; then
                  echo "Unproven replacement API could not be held stopped." >&2
                  status=1
                fi
              fi
              if [ "$leases_held" = true ]; then horse_id_migration_release_source_ownership; leases_held=false; fi
              if [ "$stage" = stopping ] && [ -n "$container" ] && [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" = true ]; then
                stage=before-stop
              fi
              if { [ "$stage" = stopped ] || [ "$stage" = stopping ]; } && [ "$target_proven" != true ]; then
                if horse_id_migration_validate_operator_binding "$data_directory" "$OPERATOR_UI_RECOVERY_OPERATION_ID" "${ownership_pairs[@]}"; then
                  old_restore_override="$APP_DIRECTORY/.operator-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.old.compose.yml"
                  old_restore_local_image="$old_image_repository:operator-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  old_restore_ready=false
                  if docker image inspect "$old_restore_local_image" >/dev/null 2>&1; then
                    echo "Exact old protected API image could not be prepared as a local immutable restore ref." >&2
                    status=1
                  elif docker image tag "$old_image_id" "$old_restore_local_image" >/dev/null 2>&1; then
                    old_restore_tag_created=true
                    if [ "$(docker image inspect --format '{{.Id}}' "$old_restore_local_image" 2>/dev/null || true)" = "$old_image_id" ]; then
                      old_restore_ready=true
                    else
                      echo "Exact old protected API image could not be prepared as a local immutable restore ref." >&2
                      status=1
                    fi
                  else
                    echo "Exact old protected API image could not be prepared as a local immutable restore ref." >&2
                    status=1
                  fi
                  printf '%s\n' 'services:' '  api:' "    image: $old_restore_local_image" '    pull_policy: never' > "$old_restore_override"
                  horse_id_migration_update_recovery_env "$APP_DIRECTORY/.env" "$old_image_repository" "$old_image_tag" || status=1
                  if ! horse_id_migration_validate_operator_binding "$data_directory" "$OPERATOR_UI_RECOVERY_OPERATION_ID" "${ownership_pairs[@]}"; then
                    echo "Old API restoration was blocked because the binding changed during recovery cleanup." >&2
                    status=1
                  elif [ "$old_restore_ready" = true ] && docker compose --env-file .env -f docker-compose.yml -f "$old_restore_override" up -d --no-deps --force-recreate api >/dev/null; then
                    restored_container="$(docker compose --env-file .env ps --status running -q api)"
                    restored_image_id="$(docker inspect --format '{{.Image}}' "$restored_container" 2>/dev/null || true)"
                    restored_image="$(docker inspect --format '{{.Config.Image}}' "$restored_container" 2>/dev/null || true)"
                    if [ -z "$restored_container" ] || [ "$restored_image" != "$old_restore_local_image" ] || [ "$restored_image_id" != "$old_image_id" ]; then
                      echo "Exact old protected API could not be restored after replacement preparation failure." >&2
                      status=1
                    fi
                  else
                    echo "Exact old protected API could not be restarted after replacement preparation failure." >&2
                    status=1
                  fi
                  rm -f -- "$old_restore_override"
                  old_restore_override=
                  if [ "$old_restore_tag_created" = true ]; then
                    docker image rm "$old_restore_local_image" >/dev/null 2>&1 || status=1
                    old_restore_tag_created=false
                  fi
                  old_restore_local_image=
                else
                  echo "Old API restoration was blocked because the binding changed after stop." >&2
                  status=1
                fi
              fi
              [ -z "$operator_override" ] || rm -f -- "$operator_override"
              [ -z "$old_restore_override" ] || rm -f -- "$old_restore_override"
              if [ "$old_restore_tag_created" = true ]; then
                docker image rm "$old_restore_local_image" >/dev/null 2>&1 || status=1
              fi
              exit "$status"
            }
            trap operator_cleanup EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            stage=stopping
            docker compose --env-file .env stop api
            stage=stopped
            horse_id_migration_assert_api_container_exited "$container"
            horse_id_migration_acquire_source_ownership --preserve-existing-maintenance-gates "${ownership_pairs[@]}"
            leases_held=true
            horse_id_migration_acquire_journal_operation_lock "$data_directory/horse-identity-migration-journal.db"
            pause_after_stop="$(horse_id_migration_assert_recovery_collection_state "$data_directory/$collection_database" 900)"
            [ "$pause_after_stop" = "$pause_before_stop" ] || {
              echo "Persisted collection pause timestamp changed across API stop." >&2
              exit 1
            }
            horse_id_migration_validate_operator_binding "$data_directory" "$OPERATOR_UI_RECOVERY_OPERATION_ID" "${ownership_pairs[@]}"
            backup_directory="$data_directory/backups/operator-ui-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            backup_paths=("${configured_stores[@]}" horse-identity-migration-initialized.marker)
            for store in "${source_relatives[@]}"; do
              directory="${store%/*}"
              [ "$directory" = "$store" ] && directory=
              name="${store##*/}"
              gate=".${name}.horse-identity-migration.maintenance"
              [ -n "$directory" ] && gate="$directory/$gate"
              backup_paths+=("$gate")
            done
            horse_id_migration_copy_store_set "$data_directory" "$backup_directory" yes "${backup_paths[@]}"
            horse_id_migration_update_recovery_env "$APP_DIRECTORY/.env" "$IMAGE_NAME" "$IMAGE_TAG"
            operator_override="$APP_DIRECTORY/.operator-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.compose.yml"
            printf '%s\n' 'services:' '  api:' '    environment:' '      HRP_HORSE_IDENTITY_OPERATOR_ONLY: "true"' > "$operator_override"
            horse_id_migration_release_source_ownership
            leases_held=false
            target_started=true
            docker compose --env-file .env -f docker-compose.yml -f "$operator_override" up -d --no-deps --force-recreate api
            rm -f -- "$operator_override"
            operator_override=
            container="$(docker compose --env-file .env ps --status running -q api)"
            [ -n "$container" ] || { echo "Protected operator API container is not running." >&2; exit 1; }
            read -r image image_id < <(docker inspect --format '{{.Config.Image}} {{.Image}}' "$container")
            [ "$image" = "$target_image" ] && [ "$image_id" = "$target_image_id" ] || { echo "Running operator API image differs from the verified target content identity." >&2; exit 1; }
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" | grep -Fx 'HRP_HORSE_IDENTITY_OPERATOR_ONLY=true' >/dev/null || {
              echo "Target API container did not receive the protected operator-only flag." >&2
              exit 1
            }
            target_proven=true
            stage=target-proven
            horse_id_migration_assert_operator_ui_ready "https://$domain" "$HORSE_RACING_API_KEY" "$OPERATOR_UI_RECOVERY_OPERATION_ID"
            echo "Protected operator UI bootstrap completed; ordinary business API remains blocked. Backup retained at $backup_directory"
            OPERATOR_UI_RECOVERY

  deploy:
    if: ${{ ! (github.event_name == 'workflow_dispatch' && (inputs.api_startup_recovery == true || inputs.operator_ui_recovery_operation_id != '')) }}
    needs: [build-and-push, deploy-collector-lambda]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Wait for SSH availability
        run: |
          for i in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              echo "SSH port reachable"
              exit 0
            fi
            echo "Waiting for SSH (attempt $i/30)..."
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Upload compose bundle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/start-caddy.sh,deploy/horse-id-migration-deploy.sh
          target: ${{ env.APP_DIRECTORY }}
          strip_components: 1

      - name: Restart remote stack
        timeout-minutes: 40
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          ACME_EMAIL: ${{ secrets.LIGHTSAIL_ACME_EMAIL }}
          HORSE_RACING_API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          COLLECTION_QUEUE_ENABLED: "true"
          AWS_REGION: ${{ secrets.AWS_REGION }}
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 38m
          envs: IMAGE_NAME,IMAGE_TAG,APP_DIRECTORY,DOMAIN_NAME,LIGHTSAIL_HOST,ACME_EMAIL,HORSE_RACING_API_KEY,COLLECTION_QUEUE_ENABLED,AWS_REGION,HORSE_ID_MIGRATION_OPERATION_ID
          script: |
            bash -s <<'HORSE_ID_MIGRATION_REMOTE'
            set -eu
            . "$APP_DIRECTORY/horse-id-migration-deploy.sh"
            horse_id_migration_require_tools
            if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
              horse_id_migration_validate_guid "$HORSE_ID_MIGRATION_OPERATION_ID" || {
                echo "Migration mode requires exactly one operation GUID." >&2
                exit 2
              }
            fi
            mkdir -p "$APP_DIRECTORY/data"
            mkdir -p "$APP_DIRECTORY/data/backups"
            if [ ! -f "$APP_DIRECTORY/.env" ]; then
              echo "Collector infrastructure credentials are missing." >&2
              exit 1
            fi
            COLLECTION_QUEUE_AWS_ACCESS_KEY_ID="$(sed -n 's/^AWS_ACCESS_KEY_ID=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY="$(sed -n 's/^AWS_SECRET_ACCESS_KEY=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN="$(sed -n 's/^JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            if [ -z "$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID" ] || [ -z "$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY" ]; then
              echo "Collector queue credentials are empty." >&2
              exit 1
            fi
            if [ -z "$JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN" ]; then
              echo "Collector alert topic ARN is empty." >&2
              exit 1
            fi
            # Must re-export: docker compose's ${DOMAIN_NAME} substitution prefers the shell
            # environment over --env-file, and DOMAIN_NAME above is still the (possibly empty)
            # raw secret value, not the sslip.io fallback computed below.
            export DOMAIN_NAME="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
            cat > "$APP_DIRECTORY/.env" <<EOF
            IMAGE_NAME=$IMAGE_NAME
            IMAGE_TAG=$IMAGE_TAG
            DOMAIN_NAME=$DOMAIN_NAME
            LIGHTSAIL_HOST=$LIGHTSAIL_HOST
            ACME_EMAIL=$ACME_EMAIL
            HORSE_RACING_API_KEY=$HORSE_RACING_API_KEY
            COLLECTION_QUEUE_ENABLED=$COLLECTION_QUEUE_ENABLED
            JOB_FAILURE_NOTIFICATIONS_ENABLED=true
            JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=$JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN
            AWS_REGION=$AWS_REGION
            AWS_ACCESS_KEY_ID=$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY
            EOF
            chmod 600 "$APP_DIRECTORY/.env"
            cd "$APP_DIRECTORY"
            docker compose --env-file .env pull
            horse_id_migration_check_image_capability "$IMAGE_NAME:$IMAGE_TAG"
            if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
              configured_store_paths="$(horse_id_migration_configured_store_paths "$APP_DIRECTORY/data")"
              mapfile -t configured_stores <<< "$configured_store_paths"
              for index in "${!configured_stores[@]}"; do configured_stores[$index]=${configured_stores[$index]%$'\r'}; done
              horse_id_migration_assert_api_paused "https://$DOMAIN_NAME" "$HORSE_RACING_API_KEY"
            fi
            docker compose --env-file .env stop api
            if [ -n "$(docker compose --env-file .env ps --status running -q api)" ]; then
              echo "API must be stopped before database backup" >&2
              exit 1
            fi
            verified_success_guid=$(horse_id_migration_journal_preflight "$APP_DIRECTORY/data" "$HORSE_ID_MIGRATION_OPERATION_ID")
            if [ -n "$verified_success_guid" ]; then
              horse_id_migration_run_fixed_command "$verified_success_guid" "$IMAGE_NAME:$IMAGE_TAG" "$APP_DIRECTORY/.env"
            fi
            if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
              backup_directory="$APP_DIRECTORY/data/backups/horse-id-migration-$HORSE_ID_MIGRATION_OPERATION_ID"
              backup_paths=("${configured_stores[@]}" horse-identity-migration-initialized.marker)
              horse_id_migration_copy_store_set "$APP_DIRECTORY/data" "$backup_directory" yes "${backup_paths[@]}"
              horse_id_migration_assert_quiescent_stores "$APP_DIRECTORY/data" "${configured_stores[@]}"
            else
              backup_timestamp="$(date -u +%Y%m%d-%H%M%S)"
              for state_db in eventstore collection-platform prediction-executions; do
                if [ -s "$APP_DIRECTORY/data/${state_db}.db-wal" ]; then
                  echo "Uncheckpointed SQLite WAL remains; refusing incomplete backup" >&2
                  exit 1
                fi
              done
              for state_db in eventstore collection-platform prediction-executions; do
                if [ -f "$APP_DIRECTORY/data/${state_db}.db" ]; then
                  cp "$APP_DIRECTORY/data/${state_db}.db" \
                    "$APP_DIRECTORY/data/backups/${state_db}-predeploy-${backup_timestamp}.db"
                  for sidecar in -wal -shm -journal; do
                    if [ -f "$APP_DIRECTORY/data/${state_db}.db${sidecar}" ]; then
                      cp "$APP_DIRECTORY/data/${state_db}.db${sidecar}" \
                        "$APP_DIRECTORY/data/backups/${state_db}-predeploy-${backup_timestamp}.db${sidecar}"
                    fi
                  done
                fi
              done
              find "$APP_DIRECTORY/data/backups" -type f -name 'eventstore-predeploy-*.db' \
                -printf '%T@ %p\n' | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm --
              for state_db in collection-platform prediction-executions; do
                find "$APP_DIRECTORY/data/backups" -type f -name "${state_db}-predeploy-*.db" \
                  -printf '%T@ %p\n' | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm --
              done
            fi
            if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
              horse_id_migration_run_fixed_command "$HORSE_ID_MIGRATION_OPERATION_ID" "$IMAGE_NAME:$IMAGE_TAG" "$APP_DIRECTORY/.env"
              horse_id_migration_assert_quiescent_stores "$APP_DIRECTORY/data" "${configured_stores[@]}"
            fi
            docker compose --env-file .env up -d --force-recreate --remove-orphans
            if [ -z "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then docker image prune -f; fi
            HORSE_ID_MIGRATION_REMOTE

      - name: Verify deployment health
        timeout-minutes: 5
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          RESOLVED_DOMAIN_NAME="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "https://${RESOLVED_DOMAIN_NAME}/swagger/v1/swagger.json" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP $code)"
              exit 0
            fi
            echo "Waiting for API to become healthy (attempt $i/18, last=$code)..."
            sleep 10
          done
          echo "API did not become healthy after deploy" >&2
          exit 1

      - name: Verify migration receipt and running image after restart
        if: inputs.horse_id_migration_operation_id != ''
        timeout-minutes: 3
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: APP_DIRECTORY,IMAGE_NAME,IMAGE_TAG,HORSE_ID_MIGRATION_OPERATION_ID
          script: |
            bash -s <<'HORSE_ID_MIGRATION_RECEIPT'
            set -eu
            cd "$APP_DIRECTORY"
            . "$APP_DIRECTORY/horse-id-migration-deploy.sh"
            horse_id_migration_require_tools
            horse_id_migration_check_image_capability "$IMAGE_NAME:$IMAGE_TAG"
            container="$(docker compose --env-file .env ps --status running -q api)"
            [ -n "$container" ]
            image="$(docker inspect --format '{{.Config.Image}}' "$container")"
            [ "$image" = "$IMAGE_NAME:$IMAGE_TAG" ] || {
              echo "Running API image differs from the migration target." >&2
              exit 1
            }
            horse_id_migration_run_fixed_command "$HORSE_ID_MIGRATION_OPERATION_ID" "$IMAGE_NAME:$IMAGE_TAG" "$APP_DIRECTORY/.env"
            horse_id_migration_check_configured_store_integrity "$APP_DIRECTORY/data"
            HORSE_ID_MIGRATION_RECEIPT

      - name: Keep API stopped after failed migration deployment
        if: failure() && inputs.horse_id_migration_operation_id != ''
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: APP_DIRECTORY
          command_timeout: 2m
          script: |
            set -eu
            cd "$APP_DIRECTORY"
            docker compose --env-file .env stop api
            if [ -n "$(docker compose --env-file .env ps --status running -q api)" ]; then
              echo "API could not be held stopped after migration failure." >&2
              exit 1
            fi

      - name: Restore collection pipeline state after deployment
        env:
          ORIGINAL_WAS_PAUSED: ${{ needs.deploy-collector-lambda.outputs.was_paused }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
        run: |
          base="https://${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}/api/v2/admin/collection"
          # Preserve an operator/incident pause; resume only after successful deployment checks.
          pipeline="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/pipeline-state")"
          jq -e '.pipeline.isPaused == true' <<<"$pipeline" >/dev/null
          if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
            echo "Migration completed; the collection pipeline remains paused for explicit verification and resume."
            exit 0
          fi
          case "$ORIGINAL_WAS_PAUSED" in true|false) ;; *) exit 1 ;; esac
          # Re-assert the pause through the newly deployed API. When SQS is empty this safely
          # releases Ready dispatch rows whose wake disappeared during the version transition.
          curl --fail --silent --show-error -X PUT -H "X-Api-Key: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"pipeline":{"paused":true,"reason":"deployment version transition"}}' "$base/pipeline" >/dev/null
          running="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/tasks?statuses=Running&pageSize=1")"
          jq -e '.page.items | type == "array" and length == 0' <<<"$running" >/dev/null
          if [ "$ORIGINAL_WAS_PAUSED" = "false" ]; then
            # A task may have failed while draining under our deployment pause.
            # Conservatively require no actionable failures (including older ones).
            failures="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/failure-notifications?view=Actionable&limit=1")"
            if ! jq -e '.notifications | type == "array" and length == 0' <<<"$failures" >/dev/null; then
              echo "::notice::Deployment succeeded; actionable collection failures remain, so the collection pipeline stays paused for explicit recovery."
              exit 0
            fi
            curl --fail --silent --show-error -X PUT -H "X-Api-Key: $API_KEY" \
              -H 'Content-Type: application/json' --data '{"pipeline":{"paused":false}}' "$base/pipeline" >/dev/null
          else
            echo "Collection remains paused; recovery requires an explicit operator decision."
          fi

  deploy-collector-lambda:
    if: ${{ ! (github.event_name == 'workflow_dispatch' && (inputs.api_startup_recovery == true || inputs.operator_ui_recovery_operation_id != '')) }}
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    outputs:
      was_paused: ${{ steps.collection-guard.outputs.was_paused }}
    defaults:
      run:
        working-directory: infra/collector-lambda
    steps:
      - uses: actions/checkout@v7

      - name: Validate optional migration request before AWS or infrastructure changes
        shell: bash
        env:
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
        run: |
          if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ] && \
             { [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || \
               [[ ! "$HORSE_ID_MIGRATION_OPERATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || \
               [ "$HORSE_ID_MIGRATION_OPERATION_ID" = "00000000-0000-0000-0000-000000000000" ]; }; then
            echo "Migration mode requires a manual dispatch with exactly one operation GUID." >&2
            exit 2
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-collector-lambda
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - id: api-url
        name: Resolve API base URL
        shell: bash
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          echo "value=https://${domain}" >> "$GITHUB_OUTPUT"

      - id: collection-guard
        name: Pause and drain collection before changing deployed versions
        shell: bash
        timeout-minutes: 27
        env:
          API_BASE_URL: ${{ steps.api-url.outputs.value }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          HORSE_ID_MIGRATION_OPERATION_ID: ${{ inputs.horse_id_migration_operation_id || '' }}
        run: |
          if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [[ ! "$HORSE_ID_MIGRATION_OPERATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || [ "$HORSE_ID_MIGRATION_OPERATION_ID" = "00000000-0000-0000-0000-000000000000" ]; then
              echo "Migration mode requires a manual dispatch with exactly one operation GUID." >&2
              exit 2
            fi
          fi
          base="$API_BASE_URL/api/v2/admin/collection"
          pipeline="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/pipeline-state")"
          was_paused="$(jq -er '.pipeline.isPaused | if type == "boolean" then tostring else error("Invalid pipeline state") end' <<<"$pipeline")"
          echo "was_paused=$was_paused" >> "$GITHUB_OUTPUT"
          if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ] && [ "$was_paused" != "true" ]; then
            echo "Migration mode requires the collection pipeline to be paused by the operator; no pause was changed." >&2
            exit 1
          fi
          if [ "$was_paused" = "false" ]; then
            curl --fail --silent --show-error -X PUT \
              -H "X-Api-Key: $API_KEY" -H 'Content-Type: application/json' \
              --data '{"pipeline":{"paused":true,"reason":"deployment version transition"}}' "$base/pipeline" >/dev/null
          fi
          pause_confirmed_at=$(date +%s)
          pause_state="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/pipeline-state")"
          jq -e '.pipeline.isPaused == true' <<<"$pause_state" >/dev/null
          drained=false
          for attempt in $(seq 1 60); do
            running="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/tasks?statuses=Running&pageSize=1")"
            count="$(jq -er '.page.items | if type == "array" then length else error("Invalid task list") end' <<<"$running")"
            if [ "$count" = "0" ]; then
              drained=true
              break
            fi
            sleep 10
          done
          if [ "$drained" != "true" ]; then
            echo "Collection drain timed out; pipeline remains paused" >&2
            exit 1
          fi
          if [ -n "$HORSE_ID_MIGRATION_OPERATION_ID" ]; then
            quiescent_at=$((pause_confirmed_at + 900))
            while [ "$(date +%s)" -lt "$quiescent_at" ]; do
              remaining=$((quiescent_at - $(date +%s)))
              if [ "$remaining" -gt 10 ]; then sleep 10; else sleep "$remaining"; fi
            done
            final_pause_state="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/pipeline-state")"
            jq -e '.pipeline.isPaused == true' <<<"$final_pause_state" >/dev/null
            final_running="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/tasks?statuses=Running&pageSize=1")"
            jq -e '.page.items | type == "array" and length == 0' <<<"$final_running" >/dev/null
          else
            curl --fail --silent --show-error -X PUT \
              -H "X-Api-Key: $API_KEY" -H 'Content-Type: application/json' \
              --data '{"pipeline":{"paused":true,"reason":"deployment version transition"}}' "$base/pipeline" >/dev/null
          fi

      - name: Initialize collector infrastructure
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}-collector-lambda" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}"

      - name: Ensure ECR repository exists
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.collector \
            -target=aws_ecr_lifecycle_policy.collector \
            -target=aws_sqs_queue.resource_collection \
            -target=aws_sqs_queue.resource_collection_dlq \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="api_base_url=${{ steps.api-url.outputs.value }}"

      - id: ecr
        name: Resolve ECR repository
        run: echo "repository=$(terraform output -raw repository_url)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - id: collector-image
        name: Check collector image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name horse-racing-prediction-collector \
            --image-ids imageTag="sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push collector image
        if: steps.collector-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.collector-lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}

      - name: Apply collector Lambda infrastructure
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="api_base_url=${{ steps.api-url.outputs.value }}" \
            -var="api_key=${{ secrets.LIGHTSAIL_API_KEY }}" \
            -var="alert_phone_number=${{ secrets.ALERT_PHONE_NUMBER }}" \
            -var="image_uri=${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}"

      - name: Verify deployed collector Lambda is active and updated
        if: inputs.horse_id_migration_operation_id != ''
        timeout-minutes: 16
        env:
          EXPECTED_COLLECTOR_IMAGE: ${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            state="$(aws lambda get-function --function-name horse-racing-prediction-collector --query 'Configuration.State' --output text 2>/dev/null || true)"
            update="$(aws lambda get-function --function-name horse-racing-prediction-collector --query 'Configuration.LastUpdateStatus' --output text 2>/dev/null || true)"
            image="$(aws lambda get-function --function-name horse-racing-prediction-collector --query 'Code.ImageUri' --output text 2>/dev/null || true)"
            if [ "$state" = "Active" ] && [ "$update" = "Successful" ] && [ "$image" = "$EXPECTED_COLLECTOR_IMAGE" ]; then
              echo "Collector Lambda is active with the expected image and successful update."
              exit 0
            fi
            sleep 10
          done
          echo "Collector Lambda did not become Active with a Successful update and the expected image." >&2
          exit 1

      - name: Load Lightsail API queue credentials
        run: |
          access_key_id="$(terraform output -raw lightsail_api_access_key_id)"
          secret_access_key="$(terraform output -raw lightsail_api_secret_access_key)"
          alert_topic_arn="$(terraform output -raw collector_alert_topic_arn)"
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          {
            echo "COLLECTION_QUEUE_AWS_ACCESS_KEY_ID=$access_key_id"
            echo "COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY=$secret_access_key"
            echo "JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=$alert_topic_arn"
          } >> "$GITHUB_ENV"

      - name: Wait for SSH availability
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Install API collection queue credentials
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          COLLECTION_QUEUE_AWS_ACCESS_KEY_ID: ${{ env.COLLECTION_QUEUE_AWS_ACCESS_KEY_ID }}
          COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY: ${{ env.COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY }}
          JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN: ${{ env.JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: APP_DIRECTORY,AWS_REGION,COLLECTION_QUEUE_AWS_ACCESS_KEY_ID,COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY,JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN
          script: |
            mkdir -p "$APP_DIRECTORY"
            env_file="$APP_DIRECTORY/.env"
            touch "$env_file"
            sed -i '/^COLLECTION_QUEUE_ENABLED=/d;/^JOB_FAILURE_NOTIFICATIONS_ENABLED=/d;/^JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=/d;/^AWS_REGION=/d;/^AWS_ACCESS_KEY_ID=/d;/^AWS_SECRET_ACCESS_KEY=/d' "$env_file"
            {
              echo "COLLECTION_QUEUE_ENABLED=true"
              echo "JOB_FAILURE_NOTIFICATIONS_ENABLED=true"
              echo "JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=$JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN"
              echo "AWS_REGION=$AWS_REGION"
              echo "AWS_ACCESS_KEY_ID=$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY"
            } >> "$env_file"
            chmod 600 "$env_file"

  migrate-race-entry-owners:
    if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.operator_ui_recovery_operation_id != '') }}
    needs: [deploy, deploy-collector-lambda]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Queue race entry owner data migration
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
        run: |
          base="https://${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}/api/v2/admin/collection"
          preview="$(curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
            "$base/migration-previews/race-entry-owner-repair")"
          echo "Race entry owner migration preview: $preview"
          echo "Owner migration remains preview-only until its target-selection change record is approved."
