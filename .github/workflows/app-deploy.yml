name: app-deploy

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .config/**
      - Dockerfile
      - Dockerfile.collector-lambda
      - .dockerignore
      - deploy/**
      - infra/collector-lambda/**
      - .github/workflows/app-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: horse-racing-prediction-production-deploy
  cancel-in-progress: false

env:
  APP_DIRECTORY: /opt/horse-racing-prediction/app

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployment pause and failure guards
        shell: pwsh
        run: ./tests/scripts/test-deploy-pipeline-state.ps1 -Bash /bin/bash

      - name: Verify collector temporary storage lifecycle
        shell: pwsh
        run: ./tests/scripts/test-collector-temp-lifecycle.ps1 -Bash /bin/bash

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore HorseRacingPrediction.sln

      - name: Build
        run: dotnet build HorseRacingPrediction.sln --no-restore --configuration Release

      - name: Install Playwright Chromium
        shell: bash
        run: |
          # ubuntu-latest includes an unrelated Google Chrome APT source. A mirror
          # publication race there must not prevent Playwright Chromium setup.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pwsh tests/HorseRacingPrediction.Scraping.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Verify database migration model
        run: dotnet ef migrations has-pending-model-changes --project src/HorseRacingPrediction.Infrastructure/HorseRacingPrediction.Infrastructure.csproj --no-build --configuration Release

      - name: Apply migrations to an empty SQLite database
        run: dotnet ef database update --project src/HorseRacingPrediction.Infrastructure/HorseRacingPrediction.Infrastructure.csproj --no-build --configuration Release --connection "Data Source=${{ runner.temp }}/eventstore-ci.db"

      - name: Test
        run: dotnet test HorseRacingPrediction.sln --no-build --configuration Release --filter "TestCategory!=External"

      - name: Check vulnerable dependencies
        run: dotnet list HorseRacingPrediction.sln package --vulnerable --include-transitive

      - name: Verify isolated API repair and cross-process locks
        shell: pwsh
        run: ./tests/scripts/test-entry-repair-local-host.ps1 -Configuration Release

      - uses: hashicorp/setup-terraform@v4

      - name: Validate collector Lambda Terraform
        run: |
          terraform fmt -check -recursive
          terraform -chdir=infra/collector-lambda init -backend=false -input=false
          terraform -chdir=infra/collector-lambda validate

      - name: Build collector Lambda container
        run: |
          docker build -f Dockerfile.collector-lambda -t collector-lambda-ci .
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/tests/scripts/test-collector-core-suppression.sh:/tmp/test-collector-core-suppression.sh:ro" \
            collector-lambda-ci /tmp/test-collector-core-suppression.sh \
            /var/runtime/bootstrap /var/runtime/collector-temp-lifecycle.sh

  build-and-push:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve image name
        id: image
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/horse-racing-prediction-api" >> "$GITHUB_OUTPUT"

      - name: Publish API
        run: dotnet publish src/HorseRacingPrediction.Api/HorseRacingPrediction.Api.csproj -c Release -o /tmp/hrp-api-publish

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.image_name }}:latest

  deploy:
    needs: [build-and-push, deploy-collector-lambda]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Wait for SSH availability
        run: |
          for i in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              echo "SSH port reachable"
              exit 0
            fi
            echo "Waiting for SSH (attempt $i/30)..."
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Upload compose bundle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/start-caddy.sh
          target: ${{ env.APP_DIRECTORY }}
          strip_components: 1

      - name: Restart remote stack
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          ACME_EMAIL: ${{ secrets.LIGHTSAIL_ACME_EMAIL }}
          HORSE_RACING_API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          COLLECTION_QUEUE_ENABLED: "true"
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,APP_DIRECTORY,DOMAIN_NAME,LIGHTSAIL_HOST,ACME_EMAIL,HORSE_RACING_API_KEY,COLLECTION_QUEUE_ENABLED,AWS_REGION
          script: |
            set -eu
            mkdir -p "$APP_DIRECTORY/data"
            mkdir -p "$APP_DIRECTORY/data/backups"
            if [ ! -f "$APP_DIRECTORY/.env" ]; then
              echo "Collector infrastructure credentials are missing." >&2
              exit 1
            fi
            COLLECTION_QUEUE_AWS_ACCESS_KEY_ID="$(sed -n 's/^AWS_ACCESS_KEY_ID=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY="$(sed -n 's/^AWS_SECRET_ACCESS_KEY=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN="$(sed -n 's/^JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            if [ -z "$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID" ] || [ -z "$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY" ]; then
              echo "Collector queue credentials are empty." >&2
              exit 1
            fi
            if [ -z "$JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN" ]; then
              echo "Collector alert topic ARN is empty." >&2
              exit 1
            fi
            # Must re-export: docker compose's ${DOMAIN_NAME} substitution prefers the shell
            # environment over --env-file, and DOMAIN_NAME above is still the (possibly empty)
            # raw secret value, not the sslip.io fallback computed below.
            export DOMAIN_NAME="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
            cat > "$APP_DIRECTORY/.env" <<EOF
            IMAGE_NAME=$IMAGE_NAME
            IMAGE_TAG=$IMAGE_TAG
            DOMAIN_NAME=$DOMAIN_NAME
            LIGHTSAIL_HOST=$LIGHTSAIL_HOST
            ACME_EMAIL=$ACME_EMAIL
            HORSE_RACING_API_KEY=$HORSE_RACING_API_KEY
            COLLECTION_QUEUE_ENABLED=$COLLECTION_QUEUE_ENABLED
            JOB_FAILURE_NOTIFICATIONS_ENABLED=true
            JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=$JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN
            AWS_REGION=$AWS_REGION
            AWS_ACCESS_KEY_ID=$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY
            EOF
            chmod 600 "$APP_DIRECTORY/.env"
            cd "$APP_DIRECTORY"
            docker compose --env-file .env pull
            docker compose --env-file .env stop api
            if [ -n "$(docker compose --env-file .env ps --status running -q api)" ]; then
              echo "API must be stopped before database backup" >&2
              exit 1
            fi
            for state_db in eventstore collection-platform prediction-executions; do
              if [ -s "$APP_DIRECTORY/data/${state_db}.db-wal" ]; then
                echo "Uncheckpointed SQLite WAL remains; refusing incomplete backup" >&2
                exit 1
              fi
            done
            if [ -f "$APP_DIRECTORY/data/eventstore.db" ]; then
              cp "$APP_DIRECTORY/data/eventstore.db" \
                "$APP_DIRECTORY/data/backups/eventstore-predeploy-$(date -u +%Y%m%d-%H%M%S).db"
            fi
            for state_db in collection-platform prediction-executions; do
              if [ -f "$APP_DIRECTORY/data/${state_db}.db" ]; then
                cp "$APP_DIRECTORY/data/${state_db}.db" \
                  "$APP_DIRECTORY/data/backups/${state_db}-predeploy-$(date -u +%Y%m%d-%H%M%S).db"
              fi
            done
            find "$APP_DIRECTORY/data/backups" -type f -name 'eventstore-predeploy-*.db' \
              -printf '%T@ %p\n' | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm --
            for state_db in collection-platform prediction-executions; do
              find "$APP_DIRECTORY/data/backups" -type f -name "${state_db}-predeploy-*.db" \
                -printf '%T@ %p\n' | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm --
            done
            docker compose --env-file .env up -d --force-recreate --remove-orphans
            docker image prune -f

      - name: Verify deployment health
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          RESOLVED_DOMAIN_NAME="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "https://${RESOLVED_DOMAIN_NAME}/swagger/v1/swagger.json" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP $code)"
              exit 0
            fi
            echo "Waiting for API to become healthy (attempt $i/18, last=$code)..."
            sleep 10
          done
          echo "API did not become healthy after deploy" >&2
          exit 1

      - name: Migrate legacy race collection jobs
        env:
          ORIGINAL_WAS_PAUSED: ${{ needs.deploy-collector-lambda.outputs.was_paused }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
        run: |
          base="https://${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}/api/admin/collection"
          # Preserve an operator/incident pause, and never resume on failed migration.
          pipeline="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/pipeline")"
          jq -e '.isPaused == true' <<<"$pipeline" >/dev/null
          case "$ORIGINAL_WAS_PAUSED" in true|false) ;; *) exit 1 ;; esac
          running="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/tasks?status=Running&limit=1")"
          jq -e 'type == "array" and length == 0' <<<"$running" >/dev/null
          response="$(curl --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
            -w $'\n%{http_code}' "$base/migrations/race-detail/apply")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$status" != "200" ]; then
            echo "Legacy race collection migration failed (HTTP $status): $body" >&2
            exit 1
          fi
          preview="$(curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
            "$base/migrations/race-detail/preview")"
          if [ "$(jq '.sourceResources' <<<"$preview")" != "0" ] || \
             [ "$(jq '.errors | length' <<<"$preview")" != "0" ]; then
            echo "Legacy race collection migration did not converge: $preview" >&2
            exit 1
          fi
          echo "Legacy race collection migration completed: $body"
          if [ "$ORIGINAL_WAS_PAUSED" = "false" ]; then
            # A task may have failed while draining under our deployment pause.
            # Conservatively require no actionable failures (including older ones).
            failures="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/failure-notifications?limit=1")"
            if ! jq -e 'type == "array" and length == 0' <<<"$failures" >/dev/null; then
              echo "Actionable failures remain; pipeline stays paused for explicit recovery" >&2
              exit 1
            fi
            curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" "$base/pipeline/resume" >/dev/null
          else
            echo "Collection remains paused; recovery requires an explicit operator decision."
          fi

  deploy-collector-lambda:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      was_paused: ${{ steps.collection-guard.outputs.was_paused }}
    defaults:
      run:
        working-directory: infra/collector-lambda
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-collector-lambda
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - id: api-url
        name: Resolve API base URL
        shell: bash
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          echo "value=https://${domain}" >> "$GITHUB_OUTPUT"

      - id: collection-guard
        name: Pause and drain collection before changing deployed versions
        shell: bash
        env:
          API_BASE_URL: ${{ steps.api-url.outputs.value }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
        run: |
          base="$API_BASE_URL/api/admin/collection"
          pipeline="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/pipeline")"
          was_paused="$(jq -er '.isPaused | if type == "boolean" then tostring else error("Invalid pipeline state") end' <<<"$pipeline")"
          echo "was_paused=$was_paused" >> "$GITHUB_OUTPUT"
          if [ "$was_paused" = "false" ]; then
            curl --fail --silent --show-error -X POST \
              -H "X-Api-Key: $API_KEY" -H 'Content-Type: application/json' \
              --data '{"reason":"deployment version transition"}' "$base/pipeline/pause" >/dev/null
          fi
          drained=false
          for attempt in $(seq 1 60); do
            running="$(curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" "$base/tasks?status=Running&limit=1")"
            count="$(jq -er 'if type == "array" then length else error("Invalid task list") end' <<<"$running")"
            if [ "$count" = "0" ]; then
              drained=true
              break
            fi
            sleep 10
          done
          if [ "$drained" != "true" ]; then
            echo "Collection drain timed out; pipeline remains paused" >&2
            exit 1
          fi

      - name: Initialize collector infrastructure
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}-collector-lambda" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}"

      - name: Ensure ECR repository exists
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.collector \
            -target=aws_ecr_lifecycle_policy.collector \
            -target=aws_sqs_queue.resource_collection \
            -target=aws_sqs_queue.resource_collection_dlq \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="api_base_url=${{ steps.api-url.outputs.value }}"

      - id: ecr
        name: Resolve ECR repository
        run: echo "repository=$(terraform output -raw repository_url)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - id: collector-image
        name: Check collector image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name horse-racing-prediction-collector \
            --image-ids imageTag="sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push collector image
        if: steps.collector-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.collector-lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}

      - name: Apply collector Lambda infrastructure
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="api_base_url=${{ steps.api-url.outputs.value }}" \
            -var="api_key=${{ secrets.LIGHTSAIL_API_KEY }}" \
            -var="alert_phone_number=${{ secrets.ALERT_PHONE_NUMBER }}" \
            -var="image_uri=${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}"

      - name: Load Lightsail API queue credentials
        run: |
          access_key_id="$(terraform output -raw lightsail_api_access_key_id)"
          secret_access_key="$(terraform output -raw lightsail_api_secret_access_key)"
          alert_topic_arn="$(terraform output -raw collector_alert_topic_arn)"
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          {
            echo "COLLECTION_QUEUE_AWS_ACCESS_KEY_ID=$access_key_id"
            echo "COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY=$secret_access_key"
            echo "JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=$alert_topic_arn"
          } >> "$GITHUB_ENV"

      - name: Wait for SSH availability
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Install API collection queue credentials
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          COLLECTION_QUEUE_AWS_ACCESS_KEY_ID: ${{ env.COLLECTION_QUEUE_AWS_ACCESS_KEY_ID }}
          COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY: ${{ env.COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY }}
          JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN: ${{ env.JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: APP_DIRECTORY,AWS_REGION,COLLECTION_QUEUE_AWS_ACCESS_KEY_ID,COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY,JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN
          script: |
            mkdir -p "$APP_DIRECTORY"
            env_file="$APP_DIRECTORY/.env"
            touch "$env_file"
            sed -i '/^COLLECTION_QUEUE_ENABLED=/d;/^JOB_FAILURE_NOTIFICATIONS_ENABLED=/d;/^JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=/d;/^AWS_REGION=/d;/^AWS_ACCESS_KEY_ID=/d;/^AWS_SECRET_ACCESS_KEY=/d' "$env_file"
            {
              echo "COLLECTION_QUEUE_ENABLED=true"
              echo "JOB_FAILURE_NOTIFICATIONS_ENABLED=true"
              echo "JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN=$JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN"
              echo "AWS_REGION=$AWS_REGION"
              echo "AWS_ACCESS_KEY_ID=$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY"
            } >> "$env_file"
            chmod 600 "$env_file"

  migrate-race-entry-owners:
    needs: [deploy, deploy-collector-lambda]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Queue race entry owner data migration
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
        run: |
          base="https://${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}/api/admin/collection"
          preview="$(curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
            "$base/migrations/race-entry-owners/preview")"
          echo "Race entry owner migration preview: $preview"
          echo "Owner migration remains preview-only until its target-selection change record is approved."
