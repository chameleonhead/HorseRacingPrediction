name: app-deploy

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .config/**
      - Dockerfile
      - Dockerfile.collector-lambda
      - .dockerignore
      - deploy/**
      - infra/collector-lambda/**
      - .github/workflows/app-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: horse-racing-prediction-production-deploy
  cancel-in-progress: false

env:
  APP_DIRECTORY: /opt/horse-racing-prediction/app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore HorseRacingPrediction.sln

      - name: Build
        run: dotnet build HorseRacingPrediction.sln --no-restore --configuration Release

      - name: Verify database migration model
        run: dotnet ef migrations has-pending-model-changes --project src/HorseRacingPrediction.Infrastructure/HorseRacingPrediction.Infrastructure.csproj --no-build --configuration Release

      - name: Apply migrations to an empty SQLite database
        run: dotnet ef database update --project src/HorseRacingPrediction.Infrastructure/HorseRacingPrediction.Infrastructure.csproj --no-build --configuration Release --connection "Data Source=${{ runner.temp }}/eventstore-ci.db"

      - name: Test
        run: dotnet test HorseRacingPrediction.sln --no-build --configuration Release

      - name: Check vulnerable dependencies
        run: dotnet list HorseRacingPrediction.sln package --vulnerable --include-transitive

      - uses: hashicorp/setup-terraform@v3

      - name: Validate collector Lambda Terraform
        run: |
          terraform fmt -check -recursive
          terraform -chdir=infra/collector-lambda init -backend=false -input=false
          terraform -chdir=infra/collector-lambda validate

      - name: Build collector Lambda container
        run: docker build -f Dockerfile.collector-lambda -t collector-lambda-ci .

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve image name
        id: image
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/horse-racing-prediction-api" >> "$GITHUB_OUTPUT"

      - name: Publish API
        run: dotnet publish src/HorseRacingPrediction.Api/HorseRacingPrediction.Api.csproj -c Release -o /tmp/hrp-api-publish

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.image_name }}:latest

  deploy:
    needs: [build-and-push, deploy-collector-lambda]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Wait for SSH availability
        run: |
          for i in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              echo "SSH port reachable"
              exit 0
            fi
            echo "Waiting for SSH (attempt $i/30)..."
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Upload compose bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/start-caddy.sh
          target: ${{ env.APP_DIRECTORY }}
          strip_components: 1

      - name: Restart remote stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          ACME_EMAIL: ${{ secrets.LIGHTSAIL_ACME_EMAIL }}
          HORSE_RACING_API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
          COLLECTION_QUEUE_ENABLED: "true"
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,APP_DIRECTORY,DOMAIN_NAME,LIGHTSAIL_HOST,ACME_EMAIL,HORSE_RACING_API_KEY,COLLECTION_QUEUE_ENABLED,AWS_REGION
          script: |
            mkdir -p "$APP_DIRECTORY/data"
            mkdir -p "$APP_DIRECTORY/data/backups"
            if [ ! -f "$APP_DIRECTORY/.env" ]; then
              echo "Collector infrastructure credentials are missing." >&2
              exit 1
            fi
            COLLECTION_QUEUE_AWS_ACCESS_KEY_ID="$(sed -n 's/^AWS_ACCESS_KEY_ID=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY="$(sed -n 's/^AWS_SECRET_ACCESS_KEY=//p' "$APP_DIRECTORY/.env" | tail -n 1)"
            if [ -z "$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID" ] || [ -z "$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY" ]; then
              echo "Collector queue credentials are empty." >&2
              exit 1
            fi
            # Must re-export: docker compose's ${DOMAIN_NAME} substitution prefers the shell
            # environment over --env-file, and DOMAIN_NAME above is still the (possibly empty)
            # raw secret value, not the sslip.io fallback computed below.
            export DOMAIN_NAME="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
            cat > "$APP_DIRECTORY/.env" <<EOF
            IMAGE_NAME=$IMAGE_NAME
            IMAGE_TAG=$IMAGE_TAG
            DOMAIN_NAME=$DOMAIN_NAME
            LIGHTSAIL_HOST=$LIGHTSAIL_HOST
            ACME_EMAIL=$ACME_EMAIL
            HORSE_RACING_API_KEY=$HORSE_RACING_API_KEY
            COLLECTION_QUEUE_ENABLED=$COLLECTION_QUEUE_ENABLED
            AWS_REGION=$AWS_REGION
            AWS_ACCESS_KEY_ID=$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY
            EOF
            chmod 600 "$APP_DIRECTORY/.env"
            cd "$APP_DIRECTORY"
            docker compose --env-file .env pull
            docker compose --env-file .env stop api || true
            if [ -f "$APP_DIRECTORY/data/eventstore.db" ]; then
              cp "$APP_DIRECTORY/data/eventstore.db" \
                "$APP_DIRECTORY/data/backups/eventstore-predeploy-$(date -u +%Y%m%d-%H%M%S).db"
            fi
            if [ -f "$APP_DIRECTORY/data/collection-tasks.db" ]; then
              cp "$APP_DIRECTORY/data/collection-tasks.db" \
                "$APP_DIRECTORY/data/backups/collection-tasks-predeploy-$(date -u +%Y%m%d-%H%M%S).db"
            fi
            find "$APP_DIRECTORY/data/backups" -type f -name 'eventstore-predeploy-*.db' \
              -printf '%T@ %p\n' | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm --
            find "$APP_DIRECTORY/data/backups" -type f -name 'collection-tasks-predeploy-*.db' \
              -printf '%T@ %p\n' | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm --
            docker compose --env-file .env up -d --force-recreate --remove-orphans
            docker image prune -f

      - name: Verify deployment health
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          RESOLVED_DOMAIN_NAME="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "https://${RESOLVED_DOMAIN_NAME}/swagger/v1/swagger.json" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP $code)"
              exit 0
            fi
            echo "Waiting for API to become healthy (attempt $i/18, last=$code)..."
            sleep 10
          done
          echo "API did not become healthy after deploy" >&2
          exit 1

  deploy-collector-lambda:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/collector-lambda
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-collector-lambda
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - id: api-url
        name: Resolve API base URL
        shell: bash
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          echo "value=https://${domain}" >> "$GITHUB_OUTPUT"

      - name: Initialize collector infrastructure
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}-collector-lambda" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}"

      - name: Ensure ECR repository exists
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.collector \
            -target=aws_ecr_lifecycle_policy.collector \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="api_base_url=${{ steps.api-url.outputs.value }}"

      - id: ecr
        name: Resolve ECR repository
        run: echo "repository=$(terraform output -raw repository_url)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.collector-lambda
          push: true
          tags: ${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}

      - name: Apply collector Lambda infrastructure
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="api_base_url=${{ steps.api-url.outputs.value }}" \
            -var="api_key=${{ secrets.LIGHTSAIL_API_KEY }}" \
            -var="image_uri=${{ steps.ecr.outputs.repository }}:sha-${{ github.sha }}"

      - name: Load Lightsail API queue credentials
        run: |
          access_key_id="$(terraform output -raw lightsail_api_access_key_id)"
          secret_access_key="$(terraform output -raw lightsail_api_secret_access_key)"
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          echo "COLLECTION_QUEUE_AWS_ACCESS_KEY_ID=$access_key_id" >> "$GITHUB_ENV"
          echo "COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY=$secret_access_key" >> "$GITHUB_ENV"

      - name: Wait for SSH availability
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.LIGHTSAIL_HOST }}/22" 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSH port 22" >&2
          exit 1

      - name: Install API collection queue credentials
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIRECTORY: ${{ env.APP_DIRECTORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          COLLECTION_QUEUE_AWS_ACCESS_KEY_ID: ${{ env.COLLECTION_QUEUE_AWS_ACCESS_KEY_ID }}
          COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY: ${{ env.COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: APP_DIRECTORY,AWS_REGION,COLLECTION_QUEUE_AWS_ACCESS_KEY_ID,COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY
          script: |
            mkdir -p "$APP_DIRECTORY"
            env_file="$APP_DIRECTORY/.env"
            touch "$env_file"
            sed -i '/^COLLECTION_QUEUE_ENABLED=/d;/^AWS_REGION=/d;/^AWS_ACCESS_KEY_ID=/d;/^AWS_SECRET_ACCESS_KEY=/d' "$env_file"
            {
              echo "COLLECTION_QUEUE_ENABLED=true"
              echo "AWS_REGION=$AWS_REGION"
              echo "AWS_ACCESS_KEY_ID=$COLLECTION_QUEUE_AWS_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$COLLECTION_QUEUE_AWS_SECRET_ACCESS_KEY"
            } >> "$env_file"
            chmod 600 "$env_file"
