name: collection-dlq-diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect actionable collection failure groups
        shell: bash
        env:
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
        run: |
          set -eu
          domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" \
            "https://${domain}/api/admin/collection/failure-notifications/groups?limit=10000" \
            | jq '[.[] | {groupKey, definition: .definition.value, status, errorCode, count}]'

      - name: Inspect API DLQ reconciliation logs and backups
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIRECTORY: /opt/horse-racing-prediction/app
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: APP_DIRECTORY
          script: |
            set -eu
            cd "$APP_DIRECTORY"
            echo "Recent collection DLQ reconciliation logs:"
            docker compose --env-file .env logs --since 20m api 2>&1 \
              | grep -E 'DLQ|dead-letter|DeadLetter|reconciliation cycle failed|AccessDenied|queue' \
              | tail -n 200 || true
            echo "Recent collection platform backups:"
            find "$APP_DIRECTORY/data/backups" -maxdepth 1 -type f \
              -name 'collection-platform-predeploy-*.db' -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %f %s bytes\n' \
              | sort -r | head -n 3
