name: collection-dlq-diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect is read-only; recover creates Recovery tasks for DeadLetterQueue groups and resumes collection.
        required: true
        type: choice
        options:
          - inspect
          - recover-dlq
          - recover-legacy-race
          - replace-stuck-legacy-race
          - enable-recovery-capacity
          - restore-capacity
        default: inspect
      confirmation:
        description: Enter RECOVER-LEGACY-DLQ, RECOVER-LEGACY-RACE, or REPLACE-STUCK-LEGACY-RACE for the selected mode.
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate recovery gate
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$MODE" in
            inspect) ;;
            recover-dlq) test "$CONFIRMATION" = RECOVER-LEGACY-DLQ ;;
            recover-legacy-race) test "$CONFIRMATION" = RECOVER-LEGACY-RACE ;;
            replace-stuck-legacy-race) test "$CONFIRMATION" = REPLACE-STUCK-LEGACY-RACE ;;
            enable-recovery-capacity) test "$CONFIRMATION" = ENABLE-RECOVERY-CAPACITY ;;
            restore-capacity) test "$CONFIRMATION" = RESTORE-CAPACITY ;;
            *) exit 1 ;;
          esac

      - name: Inspect or recover actionable collection failure groups
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
        run: |
          set -eu
          domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          base="https://${domain}/api/admin/collection"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          echo "Collection task view counts:"
          curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" \
            "$base/task-view-counts" | jq .
          echo "Collection pipeline state:"
          curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" \
            "$base/pipeline" | jq .
          echo "Legacy race active tasks:"
          curl --fail --silent --show-error -G -H "X-Api-Key: $API_KEY" \
            --data-urlencode 'statuses=Pending,Ready,Running,RetryWaiting,WaitingDiscovery' \
            --data-urlencode 'definitionId=race-detail' \
            --data-urlencode 'search=20260419:Nakayama:9' \
            --data-urlencode 'page=1' --data-urlencode 'pageSize=20' \
            "$base/tasks/search" > "$work/legacy-race-tasks.json"
          jq '{totalCount, items: [.items[] | {taskId, status, resource, availableAt, attemptCount}]}' \
            "$work/legacy-race-tasks.json"
          if [ "$MODE" = replace-stuck-legacy-race ]; then
            test "$(jq '.totalCount' "$work/legacy-race-tasks.json")" = 1
            test "$(jq '.items[0].status' "$work/legacy-race-tasks.json")" = 1
            test "$(jq '.items[0].attemptCount' "$work/legacy-race-tasks.json")" = 0
            stuck_task="$(jq -r '.items[0].taskId' "$work/legacy-race-tasks.json")"
            curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
              "$base/tasks/${stuck_task}/cancel" >/dev/null
            echo "Cancelled one unstarted legacy race task before replacement."
          fi
          curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" \
            "$base/failure-notifications/groups?limit=10000" > "$work/groups.json"
          jq '[.[] | {groupKey, definition: .definition.value, status, errorCode, count}]' "$work/groups.json"
          while IFS= read -r group_key; do
            echo "Failure group sample: $group_key"
            curl --fail --silent --show-error -H "X-Api-Key: $API_KEY" \
              "$base/failure-notifications/groups/${group_key}?page=1&pageSize=5" \
              | jq '{totalCount, items: [.items[] | {notificationId, taskId, resource, errorCode, errorMessage, requestedUrl}]}'
          done < <(jq -r '.[].groupKey' "$work/groups.json")
          case "$MODE" in
            recover-dlq)
              jq '[.[] | select(.status == 8 and .errorCode == "DeadLetterQueue")]' \
                "$work/groups.json" > "$work/targets.json" ;;
            recover-legacy-race|replace-stuck-legacy-race)
              jq '[.[] | select(.definition.value == "race-detail" and .status == 6
                and .errorCode == "InvalidOperationException"
                and .errorMessage == "Race course and number attributes are required.")]' \
                "$work/groups.json" > "$work/targets.json" ;;
            *) printf '[]' > "$work/targets.json" ;;
          esac
          target_count="$(jq 'length' "$work/targets.json")"
          target_notifications="$(jq '[.[].count] | add // 0' "$work/targets.json")"
          echo "Collection recovery targets: mode=$MODE groups=$target_count notifications=$target_notifications"
          if [ "$MODE" = inspect ] || [ "$MODE" = enable-recovery-capacity ] || [ "$MODE" = restore-capacity ]; then
            exit 0
          fi
          test "$target_count" -gt 0
          while IFS= read -r group_key; do
            curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
              -H 'Content-Type: application/json' --data '{}' \
              "$base/failure-notifications/groups/${group_key}/recover" \
              | jq '{selectedCount, createdTaskCount, reusedTaskCount, taskCount: (.taskIds | length)}'
          done < <(jq -r '.[].groupKey' "$work/targets.json")
          curl --fail --silent --show-error -X POST -H "X-Api-Key: $API_KEY" \
            "$base/pipeline/resume" >/dev/null
          echo "Collection pipeline resumed after $MODE."

      - name: Inspect API DLQ reconciliation logs and backups
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIRECTORY: /opt/horse-racing-prediction/app
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          envs: APP_DIRECTORY,MODE
          script: |
            set -eu
            cd "$APP_DIRECTORY"
            if [ "$MODE" = enable-recovery-capacity ] || [ "$MODE" = restore-capacity ]; then
              target=1
              [ "$MODE" = enable-recovery-capacity ] && target=2
              sed -i '/^COLLECTION_QUEUE_MAX_IN_FLIGHT_ENVELOPES=/d' .env
              echo "COLLECTION_QUEUE_MAX_IN_FLIGHT_ENVELOPES=$target" >> .env
              chmod 600 .env
              docker compose --env-file .env up -d --force-recreate api >/dev/null
              echo "API dispatch in-flight envelope limit set to $target."
            fi
            echo "Recent collection DLQ reconciliation logs:"
            docker compose --env-file .env logs --since 20m api 2>&1 \
              | grep -E 'DLQ|dead-letter|DeadLetter|reconciliation cycle failed|AccessDenied|queue' \
              | tail -n 200 || true
            echo "Recent collection platform backups:"
            find "$APP_DIRECTORY/data/backups" -maxdepth 1 -type f \
              -name 'collection-platform-predeploy-*.db' -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %f %s bytes\n' \
              | sort -r | head -n 3
