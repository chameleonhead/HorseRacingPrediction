name: infra-deploy

on:
  pull_request:
    paths:
      - infra/lightsail/**
      - .github/workflows/infra-deploy.yml
  push:
    branches:
      - main
    paths:
      - infra/lightsail/**
      - .github/workflows/infra-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: horse-racing-prediction-production-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/lightsail
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-infra-plan
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="availability_zone=${{ secrets.AWS_AVAILABILITY_ZONE }}" \
            -var="ssh_public_key=${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/lightsail
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-infra-apply
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}"

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="availability_zone=${{ secrets.AWS_AVAILABILITY_ZONE }}" \
            -var="ssh_public_key=${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}"
