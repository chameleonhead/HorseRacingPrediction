name: collection-monitoring

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect creates or updates change records; recover also applies the registered safe canary recipe.
        required: true
        type: choice
        options:
          - inspect
          - recover
        default: recover

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: horse-racing-prediction-collection-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      DOMAIN_NAME: ${{ secrets.LIGHTSAIL_DOMAIN_NAME }}
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      API_KEY: ${{ secrets.LIGHTSAIL_API_KEY }}
      FINDING_BRANCH: automation/collection-monitoring-findings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read monitoring findings
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          domain="${DOMAIN_NAME:-$(echo "$LIGHTSAIL_HOST" | tr '.' '-').sslip.io}"
          base="https://${domain}/api/admin/collection/monitoring"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          work="$RUNNER_TEMP/collection-monitoring"
          mkdir -p "$work"
          curl --fail --silent --show-error --max-time 90 \
            -H "X-Api-Key: $API_KEY" "$base/findings" > "$work/report.json"
          jq -e '(.enabled | type == "boolean") and (.changeRecordEnabled | type == "boolean") and (.findings | type == "array")' "$work/report.json" >/dev/null
          jq '{cutoff, completedAt, enabled, changeRecordEnabled, suppressed, suppressionReason, truncated, findingCount: (.findings | length)}' \
            "$work/report.json" | tee "$work/summary.json"
          echo "report=$work/report.json" >> "$GITHUB_OUTPUT"
          echo "records_enabled=$(jq -r '.enabled and .changeRecordEnabled and (.suppressed | not)' "$work/report.json")" >> "$GITHUB_OUTPUT"

      - name: Preview generated change records
        if: steps.inspect.outputs.records_enabled == 'true'
        shell: bash
        run: |
          python tools/collection_monitoring/change_record_writer.py \
            --repo . --report "${{ steps.inspect.outputs.report }}"

      - name: Prepare finding branch
        if: steps.inspect.outputs.records_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$FINDING_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$FINDING_BRANCH"
            git checkout -B "$FINDING_BRANCH" "origin/$FINDING_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$FINDING_BRANCH" origin/main
          fi

      - name: Create or update change records
        if: steps.inspect.outputs.records_enabled == 'true'
        id: records
        shell: bash
        run: |
          set -euo pipefail
          result="$(python tools/collection_monitoring/change_record_writer.py \
            --repo . --report "${{ steps.inspect.outputs.report }}" --apply)"
          echo "$result" | jq .
          echo "changed=$(echo "$result" | jq '(.created + .updated) | length > 0')" >> "$GITHUB_OUTPUT"

      - name: Validate and publish change records
        if: steps.records.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t records < <(git status --short --untracked-files=all | awk '{print $2}' | grep '^docs/changes/.*/README.md$')
          test "${#records[@]}" -gt 0
          python .codex/skills/document-driven-development/scripts/validate_change_records.py "${records[@]}"
          git diff --check -- "${records[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${records[@]}"
          git commit -m "Record collection monitoring findings"
          git push --set-upstream origin "$FINDING_BRANCH"
          if ! gh pr list --head "$FINDING_BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr create --base main --head "$FINDING_BRANCH" \
              --title "Record collection monitoring findings" \
              --body "Automated proposed change records generated from sanitized collection monitoring findings. No program fix or unknown-error data correction is applied by this pull request."
          fi

      - name: Preview known historical recovery
        id: recovery_preview
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 \
            -H "X-Api-Key: $API_KEY" \
            "${{ steps.inspect.outputs.base }}/known-recovery/preview" \
            | tee "$RUNNER_TEMP/collection-monitoring/recovery-preview.json"
          echo "safe=$(jq -r '.safeToApply' "$RUNNER_TEMP/collection-monitoring/recovery-preview.json")" >> "$GITHUB_OUTPUT"

      - name: Apply registered recovery canary
        if: (github.event_name == 'schedule' || inputs.mode == 'recover') && steps.recovery_preview.outputs.safe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 180 -X POST \
            -H "X-Api-Key: $API_KEY" \
            "${{ steps.inspect.outputs.base }}/known-recovery/apply" \
            | tee "$RUNNER_TEMP/collection-monitoring/recovery-result.json"
          jq -e '.failed == 0 and .examined <= 5' \
            "$RUNNER_TEMP/collection-monitoring/recovery-result.json" >/dev/null

      - name: Record run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Collection monitoring"
            if [ -f "$RUNNER_TEMP/collection-monitoring/summary.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/collection-monitoring/summary.json"
              echo '```'
            else
              echo "The monitoring API could not be read."
            fi
            if [ -f "$RUNNER_TEMP/collection-monitoring/recovery-result.json" ]; then
              echo "Registered recovery canary completed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
