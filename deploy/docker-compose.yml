services:
  api:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventStore: Data Source=/data/eventstore.db
      HORSE_RACING_API_KEY: ${HORSE_RACING_API_KEY}
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      DatabaseMigration__BackupDirectory: /data/backups
      DatabaseMigration__BackupRetentionCount: 7
      CollectionProcessing__StateDirectory: /data
      CollectionProcessing__JobStoreFileName: collection-tasks.db
      CollectionQueue__Enabled: ${COLLECTION_QUEUE_ENABLED:-false}
      CollectionQueue__QueueName: horse-racing-prediction-collector
      JobFailureNotifications__Enabled: ${JOB_FAILURE_NOTIFICATIONS_ENABLED:-false}
      JobFailureNotifications__TopicArn: ${JOB_FAILURE_NOTIFICATIONS_TOPIC_ARN:-}
      JobFailureNotifications__AdminBaseUrl: https://${DOMAIN_NAME}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
    entrypoint:
      - /bin/sh
      - /usr/local/bin/start-caddy.sh
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      LIGHTSAIL_HOST: ${LIGHTSAIL_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile.template:ro
      - ./start-caddy.sh:/usr/local/bin/start-caddy.sh:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
